- name: Commit and Push Updated Core Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*-matches.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update active matchday datasets [skip ci]" && git push)
