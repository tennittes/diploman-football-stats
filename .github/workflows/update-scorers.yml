name: Update Football Stats & Scorers

on:
  schedule:
    - cron: '5 4 * * 2,5' # Runs every Tuesday and Friday at 04:05 UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions tab

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # Grants permission to commit changes back to the repo
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run Scorer Aggregation Script
        run: node scripts/generate-scorers.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update match stats and global top scorers"
          branch: main
